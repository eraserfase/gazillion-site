# Tells IndexNow which pages changed only after their exact committed bytes are
# visible at the production origin. This remains correct after a hosting cutover.
#
# Only URLs listed in sitemap.xml are sent, plus llms.txt, so scratch pages and assets
# never reach a search engine. Removed sitemap URLs are sent too, so they drop out.
# The key file cb94b8640633c2f4af2f60ee2eb171ba.txt at the site root must stay.
#
# Run it by hand with "all" ticked to resend every sitemap URL.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Send every URL in the sitemap
        type: boolean
        default: false

permissions:
  contents: read

# No concurrency group: GitHub keeps only one queued run per group and cancels the rest,
# which dropped a push's URLs. Sends are idempotent, so overlapping runs are harmless.

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production publication and notify IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
        run: python3 .github/scripts/indexnow.py
